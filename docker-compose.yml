services:
  db:
    image: postgres:17-alpine
    container_name: magista-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-magista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magista}
      POSTGRES_DB: ${POSTGRES_DB:-magista}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - magista-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-magista}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.52
    container_name: magista-storage
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-magista}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-magista-dev-secret}
    ports:
      - "127.0.0.1:${STORAGE_PORT:-8333}:8333"
    volumes:
      - magista-storage:/data

volumes:
  magista-db:
  magista-storage:
